select:
  - platform: modbus_controller
    id: energy_management_priority
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "Energy Management Priority"
    address: 243
    value_type: U_WORD
    icon: "mdi:priority-high"
    optionsmap:
      "Battery First": 0
      "Load First": 1

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    id: system_work_mode
    name: "System Work Mode"
    address: 244
    value_type: U_WORD
    icon: "mdi:cog"
    optionsmap:
      "Selling First": 0
      "Zero Export To Load": 1
      "Zero Export To CT": 2

binary_sensor:
  - platform: template
    name: "Load Priority"
    lambda: return id(energy_management_priority).current_option() == "Load First";
    icon: "mdi:priority-high"

switch:
  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "Solar Sell"
    id: switch_solar_sell
    register_type: holding
    address: 247
    bitmask: 1
    entity_category: config
    icon: "mdi:toggle-switch"

  - platform: template
    name: "Microinverter Export cut-off"
    id: microinverter_export_cut_off
    icon: "mdi:transmission-tower"
    optimistic: true
    restore_mode: DISABLED
    lambda: "return ((int)id(reg_work_mode_280_raw).state & 0x0001) != 0;"
    turn_on_action:
      - number.set:
          id: reg_work_mode_280_raw
          value: !lambda "return ((int)id(reg_work_mode_280_raw).state) | 0x0001;"
    turn_off_action:
      - number.set:
          id: reg_work_mode_280_raw
          value: !lambda "return ((int)id(reg_work_mode_280_raw).state) & ~0x0001;"

  - platform: template
    name: "Generator Peak Shaving Enable"
    id: generator_peak_shaving_enable
    icon: "mdi:transmission-tower"
    optimistic: true
    restore_mode: DISABLED
    lambda: "return ((int)id(reg_work_mode_280_raw).state & 0x0010) != 0;"
    turn_on_action:
      - number.set:
          id: reg_work_mode_280_raw
          value: !lambda "return ((int)id(reg_work_mode_280_raw).state) | 0x0010;"
    turn_off_action:
      - number.set:
          id: reg_work_mode_280_raw
          value: !lambda "return ((int)id(reg_work_mode_280_raw).state) & ~0x0010;"

  - platform: template
    name: "Grid Peak Shaving Enable"
    id: grid_peak_shaving_enable
    icon: "mdi:transmission-tower"
    optimistic: true
    restore_mode: DISABLED
    lambda: "return ((int)id(reg_work_mode_280_raw).state & 0x0100) != 0;"
    turn_on_action:
      - number.set:
          id: reg_work_mode_280_raw
          value: !lambda "return ((int)id(reg_work_mode_280_raw).state) | 0x0100;"
    turn_off_action:
      - number.set:
          id: reg_work_mode_280_raw
          value: !lambda "return ((int)id(reg_work_mode_280_raw).state) & ~0x0100;"

  - platform: template
    name: "Generator On-Grid"
    id: generator_on_grid
    icon: "mdi:generator-stationary"
    optimistic: true
    restore_mode: DISABLED
    lambda: "return ((int)id(reg_work_mode_280_raw).state & 0x1000) != 0;"
    turn_on_action:
      - number.set:
          id: reg_work_mode_280_raw
          value: !lambda "return ((int)id(reg_work_mode_280_raw).state) | 0x1000;"
    turn_off_action:
      - number.set:
          id: reg_work_mode_280_raw
          value: !lambda "return ((int)id(reg_work_mode_280_raw).state) & ~0x1000;"

number:
  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "Work Mode 280 Raw"
    id: reg_work_mode_280_raw
    register_type: holding
    address: 280
    value_type: U_WORD
    min_value: 0
    max_value: 65535
    step: 1
    internal: true
  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    id: max_sell_power
    name: "Max Sell Power"
    unit_of_measurement: W
    device_class: power
    min_value: 0
    step: 1
    address: 245
    value_type: U_WORD
    mode: box
    icon: "mdi:cash-multiple"

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "Max Solar Power"
    id: max_solar_power
    unit_of_measurement: W
    device_class: power
    min_value: 0
    step: 1
    address: 53
    value_type: U_WORD
    mode: box
    icon: "mdi:solar-power"

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "Zero Export Power"
    id: zero_export_power
    address: 206
    unit_of_measurement: "W"
    device_class: power
    value_type: U_WORD
    min_value: 20
    max_value: 500
    step: 1
    mode: box
    icon: "mdi:transmission-tower-import"

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "Generator Peak shaving"
    id: generator_peak_shaving_power
    register_type: holding
    address: 292
    unit_of_measurement: "W"
    device_class: power
    value_type: U_WORD
    min_value: 0
    step: 1
    mode: box
    icon: "mdi:generator-stationary"

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "Grid Peak Shaving Power"
    id: grid_peak_shaving_power
    register_type: holding
    address: 293
    unit_of_measurement: "W"
    device_class: power
    value_type: U_WORD
    min_value: 0
    step: 1
    mode: box
    icon: "mdi:transmission-tower"
