sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Device Modbus Address"
    register_type: holding
    address: 1
    unit_of_measurement: ""
    accuracy_decimals: 0
    value_type: U_WORD
    icon: "mdi:identifier"
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: Device Rated Power
    id: device_rated_power_raw
    register_type: holding
    address: 16
    unit_of_measurement: W
    device_class: power
    accuracy_decimals: 0
    entity_category: diagnostic
    filters:
      - multiply: 0.1
    value_type: U_DWORD_R
    icon: mdi:flash

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: Device MPPTs
    register_type: holding
    address: 18
    unit_of_measurement: ""
    accuracy_decimals: 0
    value_type: U_WORD
    icon: mdi:solar-panel
    entity_category: diagnostic
    filters:
      - lambda: |-
          uint16_t value = (uint16_t)x;
          // Extract upper nibble (bits 8-11) and shift right 8 bits
          uint16_t mppts = (value >> 8) & 0x0F;
          // Validation: if value exceeds 12 MPPTs, use default of 2
          if (mppts < 1 || mppts > 12) {
            return 2.0;
          }
          return (float)mppts;

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: Device Phases
    register_type: holding
    address: 18
    unit_of_measurement: ""
    accuracy_decimals: 0
    value_type: U_WORD
    icon: mdi:transmission-tower
    entity_category: diagnostic
    filters:
      - lambda: |-
          uint16_t value = (uint16_t)x;
          // Extract lower nibble (bits 0-3)
          uint16_t phases = value & 0x0F;
          // Validation: if value exceeds 3 phases, use default of 3
          if (phases < 1 || phases > 3) {
            return 3.0;
          }
          return (float)phases;

