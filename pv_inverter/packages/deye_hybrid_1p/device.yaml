text_sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    bitmask: 0
    register_type: holding
    address: 59
    raw_encode: HEXBYTES
    name: Running Status
    icon: mdi:play-circle
    lambda: |-
      uint16_t value = modbus::helpers::word_from_hex_str(x, 0);
      switch (value) {
        case 0: return std::string("standby");
        case 1: return std::string("selfcheck");
        case 2: return std::string("normal");
        case 3: return std::string("alarm");
        case 4: return std::string("fault");
        default: return std::string("----");
      }
      return x;

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: Device Type
    register_type: holding
    address: 0
    bitmask: 0
    raw_encode: HEXBYTES
    icon: mdi:chip
    entity_category: diagnostic
    lambda: |-
      uint16_t value = modbus::helpers::word_from_hex_str(x, 0);
      switch (value) {
        case 0x0000: return std::string("Unknown");
        case 0x0002:
        case 0x0200: return std::string("String Inverter");
        case 0x0003:
        case 0x0300: return std::string("Single-Phase Hybrid Inverter");
        case 0x0004:
        case 0x0400: return std::string("Microinverter");
        case 0x0005:
        case 0x0500: return std::string("LV 3-Phase Hybrid Inverter");
        case 0x0006: return std::string("HV 3-Phase Hybrid Inverter");
        case 0x0007:
        case 0x0600: return std::string("HV 3-Phase Inverter 6-15kW");
        case 0x0008:
        case 0x0601: return std::string("HV 3-Phase Inverter 20-50kW");
        default: return std::string("Unknown");
      }

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: Device Serial Number
    register_type: holding
    address: 3
    response_size: 10
    bitmask: 0
    raw_encode: NONE
    icon: mdi:barcode
    entity_category: diagnostic
    lambda: |-
      if (x.size() < 10) return std::string("N/A");
      std::string serial;

      for (int i = 0; i < 10; i += 2) {
        char high = x[i];
        char low = x[i + 1];
        if (high != 0) serial += high;
        if (low != 0) serial += low;
      }
      return serial.empty() ? std::string("N/A") : serial;

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Device Protocol Version"
    register_type: holding
    address: 2
    bitmask: 0
    raw_encode: NONE
    icon: "mdi:protocol"
    entity_category: diagnostic
    lambda: |-
      if (x.size() < 2) return std::string("N/A");
      uint16_t value = ((uint16_t)(uint8_t)x[0] << 8) | (uint8_t)x[1];
      char buffer[10];
      snprintf(buffer, sizeof(buffer), "%04X", value);
      return std::string(buffer);

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Device Chip Type"
    register_type: holding
    address: 9
    bitmask: 0
    raw_encode: NONE
    icon: "mdi:chip"
    entity_category: diagnostic
    lambda: |-
      if (x.size() < 2) return std::string("N/A");
      uint16_t value = ((uint16_t)(uint8_t)x[0] << 8) | (uint8_t)x[1];
      switch (value & 0x0F) {
        case 1: return std::string("AT32F403A");
        case 2: return std::string("SXX32F103");
        case 3: return std::string("GD32F103");
        case 4: return std::string("GD32F303");
        default: {
          char buffer[20];
          snprintf(buffer, sizeof(buffer), "Unknown (%04X)", value);
          return std::string(buffer);
        }
      }

  - platform: modbus_controller
