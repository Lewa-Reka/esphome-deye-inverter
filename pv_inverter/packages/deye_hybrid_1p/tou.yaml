switch:
  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "Time of Use"
    id: switch_time_of_use
    register_type: holding
    address: 248
    bitmask: 1
    icon: "mdi:toggle-switch"

  # --- Time of Use Slot Controls (Registers 274..279) ---
  # Sell Mode corresponds to the undocumented bit 6 (0x40) of per-slot control registers 274-279.
  # It is not documented in the V119 protocol, but enables battery discharge to grid down to the slot SoC.
  # Note: Grid Charge (bit 0), Gen Charge (bit 1), and Sell Mode (bit 6) can be active simultaneously.

  # --- Time of Use Slot 1 Controls (Register 274) ---
  - platform: template
    name: "Time of Use 1 Charge Enable"
    id: switch_time_point_1_charge_enable
    icon: "mdi:battery-plus"
    optimistic: true
    restore_mode: DISABLED
    lambda: |-
      if (isnan(id(time_of_use_1_raw).state)) return {};
      return ((int)id(time_of_use_1_raw).state & 0b00000001) != 0;
    turn_on_action:
      - if:
          condition:
            lambda: "return !isnan(id(time_of_use_1_raw).state);"
          then:
            - number.set:
                id: time_of_use_1_raw
                value: !lambda "return (int)id(time_of_use_1_raw).state | 0b00000001;"
    turn_off_action:
      - if:
          condition:
            lambda: "return !isnan(id(time_of_use_1_raw).state);"
          then:
            - number.set:
                id: time_of_use_1_raw
                value: !lambda "return (int)id(time_of_use_1_raw).state & ~0b00000001;"

  - platform: template
    name: "Time of Use 1 Gen Charge"
    id: switch_time_point_1_gen_charge
    icon: "mdi:generator-stationary"
    optimistic: true
    restore_mode: DISABLED
    lambda: |-
