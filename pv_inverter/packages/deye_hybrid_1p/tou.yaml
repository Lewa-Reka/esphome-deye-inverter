substitutions:
  func_int_to_time: |-
    uint8_t hours = raw / 100;
    uint8_t minutes = raw - (hours * 100);
    return ESPTime {.minute = minutes, .hour = hours};
  func_time_to_int: "return x.hour * 100 + x.minute;"
  # write_lambda body for bitmask switches sharing a register (248, 274-279, 326).
  # A plain modbus_controller bitmask switch writes (state ? bitmask : 0) and wipes the
  # other bits, so read-modify-write through the hidden raw number `raw` of that register.
  bit_rmw_write: |-
    if (std::isnan(raw->state)) {
      ESP_LOGW("deye", "%s: register not read yet, write skipped", item->get_name().c_str());
      return {};
    }
    uint16_t value = (uint16_t) raw->state;
    value = x ? (value | item->bitmask) : (value & ~item->bitmask);
    raw->make_call().set_value(value).perform();
    item->publish_state(x);
    return {};

datetime:
  - platform: template
    name: "Time of Use 1 Start"
    id: time_of_use_1_start
    type: time
    update_interval: 15s
    lambda: |-
      auto raw = id(time_of_use_1_start_raw).state;
      ${func_int_to_time}
    set_action:
      - number.set:
          id: time_of_use_1_start_raw
          value: !lambda ${func_time_to_int}

